version: "3.8"
name: next-skill-compose
services:
  next-skill-db:
    image: postgres:13.4
    container_name: next-skill-database
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data

  next-skill-app:
    image: axterrr/next-skill:2.0.0
    container_name: next-skill-application
    env_file: .env
    environment:
      DB_HOST: next-skill-db
      DB_PORT: 5432
    ports:
      - "8080:8080"
    depends_on:
      - next-skill-db

volumes:
  database:
